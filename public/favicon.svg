<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="krGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#E6173B" />
      <stop offset="100%" stop-color="#B30D2E" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C85" />
      <stop offset="100%" stop-color="#4A0512" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle with Glass Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0D0608" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Neural Synapse Nodes -->
  <circle cx="16" cy="18" r="2.5" fill="#FF3366" opacity="0.9" />
  <circle cx="48" cy="18" r="2.5" fill="#FF3366" opacity="0.9" />
  <line x1="16" y1="18" x2="48" y2="18" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5" />
  
  <!-- Modern KR Monogram Typography -->
  <text x="30" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" text-anchor="middle" fill="url(#krGrad)" letter-spacing="1">KR</text>
  
  <!-- Glowing AI Status Accent Dot -->
  <circle cx="49" cy="42" r="3.5" fill="#10B981" filter="url(#glow)" />
</svg>
